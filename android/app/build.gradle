plugins { id 'com.android.application' }

android {
    namespace 'org.dxrust.port'
    compileSdk 36

    defaultConfig {
        applicationId 'org.dxrust.port'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-android'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideload/testing artifact. Replace with a private upload/release key before any store distribution.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { prefab true }
    packaging {
        jniLibs { useLegacyPackaging = true; pickFirsts += ["**/libc++_shared.so"] }
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    }
}

dependencies {
    // Must stay compatible with android-activity 0.6.x used by Bevy 0.19.
    implementation 'androidx.games:games-activity:4.4.0'
}
