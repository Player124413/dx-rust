name: Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK / NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdline-tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Resolve and persist Cargo.lock
        run: |
          set -o pipefail
          if ! cargo metadata --format-version 1 >metadata.json 2>lock.log; then
            cat lock.log
            while IFS= read -r line; do echo "::error file=Cargo.toml::$line"; done < lock.log
            exit 1
          fi
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Update Cargo.lock for Android dependencies [skip ci]"
            git push origin HEAD:arena/c6e3e0a1-dx-rust
          fi
      - name: Verify Cargo.lock
        run: cargo metadata --format-version 1 --locked >/dev/null

      - name: ETC2 encoder tests
        run: |
          set -o pipefail
          cargo test -p dx-level --lib etc2 2>&1 | tee etc2-test.log

      - name: Build Rust libraries
        env:
          ABIS: arm64-v8a
        run: |
          set -o pipefail
          bash android/build_rust.sh 2>&1 | tee rust-build.log

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Persist failure logs for debugging
        if: failure()
        run: |
          mkdir -p ci-logs
          for f in lock.log etc2-test.log rust-build.log gradle-build.log; do [ -f "$f" ] && cp "$f" ci-logs/ || true; done
          if ls ci-logs/* >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f ci-logs
            git commit -m "CI failure logs [skip ci]"
            git push origin HEAD:arena/c6e3e0a1-dx-rust
          fi
      - name: Surface build errors in annotations
        if: failure()
        run: |
          for f in lock.log etc2-test.log rust-build.log gradle-build.log; do
            [ -f "$f" ] || continue
            grep -E '^error|error\[|error:|FAILURE:|What went wrong|Caused by:|FAILED|panicked|assertion|PSNR' "$f" | head -80 | while IFS= read -r line; do
              echo "::error file=$f::$line"
            done
            if [ "$f" = "rust-build.log" ]; then
              grep -n -B2 -A8 'error\[' "$f" | head -200 | while IFS= read -r line; do
                echo "::error file=$f::$line"
              done
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dx-rust-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
