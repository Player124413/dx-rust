name: Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK / NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: ETC2 encoder tests
        run: cargo test -p dx-level --lib etc2
      - name: Build Rust libraries
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: ./android/build_rust.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle -p android assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dx-rust-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
